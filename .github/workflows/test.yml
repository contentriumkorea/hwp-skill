name: Skill tests
on:
  push:
    branches: [main, feat/reliability-portability-upgrade]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install portable raster validator dependency
        run: python -m pip install Pillow
      - name: Install the repository's test runner
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 4.10.1 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 4.10.1 -Force
      - name: Run tests without Hancom
        run: |
          python -X utf8 -m unittest discover -s tests -p test_model_catalog.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Import-Module Pester -RequiredVersion 4.10.1 -Force
          ./tests/run-tests.ps1 -Suite $(if ($IsWindows) { 'Static' } else { 'Portable' })
      - name: Build the standalone skill package
        run: ./package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: hwp-skill-${{ matrix.os }}
          path: dist/hwp-skill.zip
