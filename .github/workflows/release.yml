name: Versioned skill package
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install portable raster validator dependency
        run: python -m pip install Pillow
      - name: Check version and run tests
        run: |
          $version=(Get-Content skills/hwp-skill/version.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag and packaged version differ.' }
          python -X utf8 -m unittest discover -s tests -p test_model_catalog.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -RequiredVersion 4.10.1 -Force -Scope CurrentUser -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 4.10.1 -Force
          ./tests/run-tests.ps1 -Suite Static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./package.ps1
          $hash=(Get-FileHash dist/hwp-skill.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path (Get-Location) 'dist/SHA256SUMS'), "$hash  hwp-skill.zip`n")
      - name: Publish versioned ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/hwp-skill.zip dist/SHA256SUMS --verify-tag --title "HWP Skill $env:GITHUB_REF_NAME" --notes-file CHANGELOG.md
