<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-label="HWP 읽기와 HWPX 작성의 기능 흐름">
<rect width="1100" height="440" rx="18" fill="#101b27"/>
<g font-family="Segoe UI,Malgun Gothic,sans-serif">
<text x="48" y="57" font-size="14" letter-spacing="3" fill="#89aabd">DOCUMENT WORKFLOW</text>
<text x="48" y="105" font-size="29" fill="#f2f6f8">원본은 그대로. 작업은 별도 결과로.</text>
<g fill="#1b3042" stroke="#405e73"><rect x="48" y="151" width="280" height="178" rx="12"/><rect x="410" y="151" width="280" height="178" rx="12"/><rect x="772" y="151" width="280" height="178" rx="12"/></g>
<g fill="#7faac2" font-size="13"><text x="72" y="183">01 / READ</text><text x="434" y="183">02 / WRITE</text><text x="796" y="183">03 / CHECK</text></g>
