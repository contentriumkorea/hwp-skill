<g fill="#b0c4d2" font-size="16"><text x="72" y="267">HWP 5.x · HWT · HWPX</text><text x="72" y="295">원본의 내용을 확인합니다.</text><text x="434" y="267">새 문서 · 표 · 이미지 · 서식</text><text x="434" y="295">기존 HWPX를 수정합니다.</text><text x="796" y="267">구조 검사 · 근사 미리보기</text><text x="796" y="295">실제 한컴 조판과 구분합니다.</text></g>
